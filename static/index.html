<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExitKit AI — передача дел</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#132438;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#11243e;color:white;padding:29px max(20px,calc((100vw - 1060px)/2))}header h1{margin:0 0 5px;font-size:28px}header p{margin:0;color:#cfdfeb}main{max-width:1060px;margin:32px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:23px;box-shadow:0 4px 20px #14243b0a}h2{margin:0 0 14px;font-size:20px}h3{font-size:15px;margin:22px 0 9px}textarea,input{width:100%;border:1px solid #ced9e5;border-radius:8px;padding:11px;font:inherit}textarea{min-height:245px;resize:vertical}button{cursor:pointer;background:#1768a2;border:0;color:white;border-radius:9px;padding:11px 16px;font-weight:650}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e8f1f8;color:#15537b}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.notice{color:#6b7886;font-size:13px;line-height:1.5}.error{color:#b42318}label{font-weight:600;display:block;margin:14px 0 7px}.task{border:1px solid #d7e4ee;border-radius:12px;padding:13px;margin:11px 0;background:#fbfdff}.task label{font-size:12px;color:#43546a}.task input,.task textarea{margin-top:4px}.task textarea{min-height:65px}.item-row{display:flex;gap:8px;margin:8px 0}.item-row input{flex:1}.item-row button{padding:5px 10px;background:#fcebea;color:#ab2828}.small{font-size:13px}#results{display:none}@media(max-width:850px){main{grid-template-columns:1fr}} 
  </style>
</head>
<body>
<header><h1>ExitKit AI</h1><p>Открытый AI-агент для передачи дел без потери контекста</p></header>
<main>
<section class="panel"><h2>1. Загрузите исходные заметки</h2><label for="notes">Текст, черновики, описание проектов</label><textarea id="notes" placeholder="Например: Я веду запуск сайта. Дизайн готов, ждём доступы от ИТ. Следующий шаг — согласовать релиз с командой..."></textarea><label for="files">Файлы TXT, MD, PDF, DOCX (до 5 МБ каждый)</label><input id="files" type="file" multiple accept=".txt,.md,.pdf,.docx"/><div class="toolbar"><button id="generate">Создать пакет передачи</button><button class="secondary" id="example">Вставить пример</button></div><p class="notice">По умолчанию используется локальная модель Ollama. Исходные файлы не сохраняются на сервере. Проверяйте данные перед передачей.</p><p id="status" role="status"></p></section>
<section class="panel" id="results"><h2>2. Проверьте и отредактируйте</h2><label for="role">Роль</label><input id="role"/><label for="summary">Краткий обзор</label><textarea id="summary" style="min-height:100px"></textarea><h3>Карточки задач</h3><div id="tasks"></div><button class="secondary" id="add-task">+ Добавить задачу</button><div id="collections"></div><div class="toolbar"><button id="export">Скачать PDF</button><button id="json" class="secondary">Скачать JSON</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let handover=null;
const fields=['title','status','priority','owner','deadline','source_excerpt'];
const listFields=[['open_questions','Открытые вопросы'],['contacts','Контакты'],['checklist','Чек-лист'],['warnings','Предупреждения']];
const newTask=()=>({title:'',status:'неизвестно',priority:'средний',owner:'не назначен',next_steps:[],blockers:[],deadline:'',source_excerpt:''});
function render(){if(!handover)return;$('results').style.display='block';$('role').value=handover.role||'';$('summary').value=handover.summary||'';$('tasks').replaceChildren();handover.tasks.forEach((task,i)=>{const div=document.createElement('div');div.className='task';const title=document.createElement('strong');title.textContent=`Задача ${i+1}`;div.append(title);for(const key of fields){let label=document.createElement('label');label.textContent=({title:'Название',status:'Статус',priority:'Приоритет',owner:'Ответственный',deadline:'Срок',source_excerpt:'Цитата-основание'})[key];const inp=document.createElement('input');inp.value=task[key]||'';inp.addEventListener('input',()=>task[key]=inp.value);label.append(inp);div.append(label)}for(const key of ['next_steps','blockers']){const label=document.createElement('label');label.textContent=key==='next_steps'?'Следующие шаги (по одному на строке)':'Блокеры (по одному на строке)';const inp=document.createElement('textarea');inp.value=(task[key]||[]).join('\n');inp.addEventListener('input',()=>task[key]=inp.value.split('\n').map(s=>s.trim()).filter(Boolean));label.append(inp);div.append(label)}const del=document.createElement('button');del.className='secondary';del.textContent='Удалить задачу';del.addEventListener('click',()=>{handover.tasks.splice(i,1);render()});div.append(del);$('tasks').append(div)});$('collections').replaceChildren();for(const [key,title] of listFields){const box=document.createElement('div');const h=document.createElement('h3');h.textContent=title;box.append(h);(handover[key]||[]).forEach((val,i)=>{const row=document.createElement('div');row.className='item-row';const inp=document.createElement('input');inp.value=val;inp.addEventListener('input',()=>handover[key][i]=inp.value);const btn=document.createElement('button');btn.textContent='×';btn.title='Удалить';btn.addEventListener('click',()=>{handover[key].splice(i,1);render()});row.append(inp,btn);box.append(row)});const add=document.createElement('button');add.className='secondary small';add.textContent='+ Добавить';add.addEventListener('click',()=>{handover[key].push('');render()});box.append(add);$('collections').append(box)}}
function sync(){handover.role=$('role').value;handover.summary=$('summary').value}
function download(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('generate').addEventListener('click',async()=>{const btn=$('generate');btn.disabled=true;$('status').className='';$('status').textContent='Модель анализирует материалы…';try{const form=new FormData();form.append('notes',$('notes').value);for(const f of $('files').files)form.append('files',f);const r=await fetch('/api/generate',{method:'POST',body:form});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Ошибка');handover=data;render();$('status').textContent='Черновик готов. Проверьте каждое поле перед экспортом.'}catch(e){$('status').className='error';$('status').textContent=e.message}finally{btn.disabled=false}});
$('add-task').addEventListener('click',()=>{handover.tasks.push(newTask());render()});
$('export').addEventListener('click',async()=>{sync();const r=await fetch('/api/export/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(handover)});if(!r.ok){alert('Не удалось создать PDF');return}download(await r.blob(),'exitkit-handover.pdf')});
$('json').addEventListener('click',()=>{sync();download(new Blob([JSON.stringify(handover,null,2)],{type:'application/json'}),'exitkit-handover.json')});
$('example').addEventListener('click',()=>{$('notes').value='Я — менеджер проекта сайта. Релиз запланирован после проверки ИТ, точная дата не подтверждена. Макеты утверждены. Задача: получить доступ к staging у ИТ, затем провести QA и согласовать запуск с маркетингом. Блокер: доступов пока нет. Открытый вопрос: кто принимает финальное решение по запуску? Контакт: команда ИТ через корпоративный чат.'});
</script>
</body>
</html>
